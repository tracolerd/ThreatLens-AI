<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThreatLens-AI</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="container">
        <header>
            <h2>ThreatLens-AI</h2>
            <span class="badge">Shield Active</span>
        </header>

        <div class="url-box">
            <p id="current-url">Detecting current URL...</p>
        </div>

        <div id="scanner-section" class="scanner-section">
            <button id="scan-btn" class="btn">Scan This Page</button>
        </div>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Analyzing threat intelligence...</p>
        </div>

        <div id="results" class="results hidden">
            <div class="score-container">
                <span id="threat-score" class="score-num">0</span>
                <span class="score-label">Threat Score</span>
            </div>
            <div id="status-badge" class="status-badge">SAFE</div>
            <div class="reasons-box">
                <h4>Analysis Reasons:</h4>
                <ul id="reasons-list"></ul>
            </div>
        </div>

        <div id="error-box" class="error-box hidden">
            <p id="error-message"></p>
        </div>
    </div>
    <script src="popup.js"></script>
</body>

</html>
